#!/usr/sbin/nft -f
# ALISHA host firewall (2026-11-23). Inbound: deny by default. Outbound: unchanged.
# Undo:  sudo systemctl disable --now nftables && sudo nft flush ruleset
flush ruleset

define LAN4 = 192.168.1.0/24

table inet alisha_fw {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ping + IPv6 neighbour discovery / router adverts (IPv6 breaks without these)
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 accept

        # keep getting an address from the router
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # local name discovery (avahi / .local)
        ip daddr 224.0.0.251 udp dport 5353 accept
        ip6 daddr ff02::fb udp dport 5353 accept

        # SSH only from the home LAN
        ip saddr $LAN4 tcp dport 22 ct state new accept
        ip6 saddr fe80::/10 tcp dport 22 ct state new accept

        # Pi screen viewer (noVNC over Wi-Fi) - only the Lenovo tablet
        ip saddr 192.168.1.180 tcp dport 6081 ct state new accept

        # everything else: dropped (logged at a low rate)
        limit rate 3/minute log prefix "alisha-fw drop: " level info
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
