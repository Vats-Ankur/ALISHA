--[[ A.L.I.S.H.A. HUD for Kali on Raspberry Pi 5 ---------------------------
     Right-side system monitor. Cyan-on-transparent, monospace.
     Toggle with the desktop "ALISHA HUD" launcher or: conky -c ~/.config/conky/alisha.conf
----------------------------------------------------------------------------]]

conky.config = {
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 430,
    maximum_width = 430,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 120,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'Conky',

    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    border_width = 1,

    use_xft = true,
    font = 'Hack:size=9',
    xftalpha = 0.9,
    override_utf8_locale = true,

    update_interval = 1.0,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    temperature_unit = 'celsius',

    default_color = '2f9fd0',
    color1 = '1fb6ff',   -- bright cyan (headers)
    color2 = 'bfe9ff',   -- near white (values)
    color3 = '2f9fd0',   -- mid cyan
    color4 = '0e4a6b',   -- dim

    use_spacer = 'none',
}

conky.text = [[
${color1}${font Hack:bold:size=16}A.L.I.S.H.A.${font}${color4}  online${color}
${color3}${font Hack:size=8}Advanced Learning Intelligent System for Human Assistance${font}${color}
${color4}${hr 1}${color}
${color1}HOST ${color2}${nodename}${alignr}${color1}${time %H:%M:%S}
${color4}${time %A %d %B %Y}${alignr}${color4}up ${uptime_short}
${color4}${hr 1}${color}
${color1}SYSTEM
${color}Kernel ${alignr}${color2}${kernel}
${color}CPU ${alignr}${color2}${freq_g}GHz  ${hwmon 0 temp 1}°C
${color}Load ${alignr}${color2}${loadavg 1} ${loadavg 2} ${loadavg 3}
${color4}${hr 1}${color}
${color1}PROCESSOR${alignr}${color2}${cpu cpu0}%
${color}C0 ${color2}${cpubar cpu1 6,70}${color}  C1 ${color2}${cpubar cpu2 6,70}
${color}C2 ${color2}${cpubar cpu3 6,70}${color}  C3 ${color2}${cpubar cpu4 6,70}
${color4}${hr 1}${color}
${color1}MEMORY ${color2}${mem}${color} / ${memmax}${alignr}${color2}${memperc}%
${color2}${membar 8}
${color1}SWAP${alignr}${color2}${swapperc}%
${color2}${swapbar 6}
${color4}${hr 1}${color}
${color1}STORAGE
${color}SD  / ${alignr}${color2}${fs_used /} / ${fs_size /}  ${fs_used_perc /}%
${color2}${fs_bar 8 /}
${color4}${hr 1}${color}
${color1}NETWORK ${color2}${addr wlan0}
${color}▼ ${color2}${downspeed wlan0}${alignr}${color}▲ ${color2}${upspeed wlan0}
${color2}${downspeedgraph wlan0 28,200 0e4a6b 1fb6ff} ${upspeedgraph wlan0 28,200 0e4a6b 1fb6ff}
${color}Down ${color2}${totaldown wlan0}${alignr}${color}Up ${color2}${totalup wlan0}
${color4}${hr 1}${color}
${color1}PROCESSES ${color4}(by cpu)${color}
${color2}${top name 1}${alignr}${top cpu 1}%
${color}${top name 2}${alignr}${top cpu 2}%
${color}${top name 3}${alignr}${top cpu 3}%
${color1}PROCESSES ${color4}(by mem)${color}
${color2}${top_mem name 1}${alignr}${top_mem mem 1}%
${color}${top_mem name 2}${alignr}${top_mem mem 2}%
${color4}${hr 1}${color}
${color1}SECURITY${color}
Firewall ${alignr}${color2}${if_match "${exec nft list ruleset 2>/dev/null | grep -c drop}">"0"}active${else}${color1}check${endif}${color}
SSH ${alignr}${color2}${exec systemctl is-active ssh}
${color4}${scroll 44 2  ●  ARC REACTOR STABLE  ●  THREAT LEVEL MINIMAL  ●  ALL SYSTEMS NOMINAL  }${color}
]]
